<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Stringstack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card">
        <h1>Welcome back</h1>
        <p class="muted">Log in to your account</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <p id="formError" class="error" hidden></p>

            <button type="submit">Log in</button>
        </form>

        <p class="muted">Don't have an account? <a href="register.html">Register</a></p>
    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        const loginForm = document.getElementById("loginForm");
        const formError = document.getElementById("formError");

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            formError.hidden = true;

            const payload = Object.fromEntries(new FormData(loginForm));

            try {
                const result = await postJson("/api/auth/login", payload);
                localStorage.setItem("token", result.token);
                window.location.href = "dashboard.html";
            } catch (error) {
                if (error.status === 401) {
                    showError(formError, "Invalid email or password.");
                } else if (error.status === 400) {
                    showError(formError, "Please enter your email and password.");
                } else {
                    showError(formError, "Something went wrong. Please try again.");
                }
            }
        });
    </script>
</body>
</html>
